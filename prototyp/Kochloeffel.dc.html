<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:2px;color:var(--mut)">
<sc-for list="{{ spoons }}" as="s" hint-placeholder-count="5">
<sc-if value="{{ s.on }}" hint-placeholder-val="{{ true }}">
<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.6" rx="4.3" ry="5.1" fill="#E8B33A"></ellipse><rect x="10.7" y="11" width="2.6" height="10" rx="1.3" fill="#E8B33A"></rect></svg>
</sc-if>
<sc-if value="{{ s.off }}">
<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6.6" rx="4.3" ry="5.1" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.5"></ellipse><rect x="10.7" y="11" width="2.6" height="10" rx="1.3" fill="currentColor" opacity="0.35"></rect></svg>
</sc-if>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:40},&quot;value&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.5}}">
class Component extends DCLogic {
  renderVals() {
    const v = Number(this.props.value ?? 0);
    return { spoons: [1,2,3,4,5].map(i => ({ on: i <= Math.round(v), off: i > Math.round(v) })) };
  }
}
</script>
</body>
</html>
